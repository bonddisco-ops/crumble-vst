name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            pluginval: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
          - os: macos-latest
            name: macOS
            pluginval: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Crumble_artefacts/Release/VST3/. dist/
          mkdir -p "dist/Standalone (test without DAW)"
          cp -R build/Crumble_artefacts/Release/Standalone/. "dist/Standalone (test without DAW)/"
          ls -R dist | head -n 40

      # macOS: GitHub artifacts drop the "executable" flag on files, so the Mac
      # plugin would arrive broken ("Could not load executable"). We sign the
      # bundles (ad-hoc) and pack them with ditto, which keeps flags intact.
      - name: Sign and pack (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - "dist/Crumble.vst3"
          codesign --force --deep --sign - "dist/Standalone (test without DAW)/Crumble.app"
          codesign --verify --deep --strict "dist/Crumble.vst3"
          lipo -info "dist/Crumble.vst3/Contents/MacOS/Crumble"
          mkdir pack
          ditto -c -k --keepParent "dist/Crumble.vst3" "pack/Crumble-VST3-macOS.zip"
          ditto -c -k --keepParent "dist/Standalone (test without DAW)/Crumble.app" "pack/Crumble-Standalone-macOS.zip"
          cp .github/mac-install.txt "pack/HOW TO INSTALL.txt"
          ls -la pack

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Crumble-${{ matrix.name }}
          path: pack
          if-no-files-found: error

      - name: Upload
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Crumble-${{ matrix.name }}
          path: dist
          if-no-files-found: error

      # Automatic plugin test (opens the plugin and its window, checks for crashes).
      # It does not block the download if it fails.
      - name: Test with pluginval
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q -o pluginval.zip
          ${{ matrix.pluginval_bin }} --strictness-level 5 --verbose --validate "dist/Crumble.vst3"
